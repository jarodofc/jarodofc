<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 15px; fill: #e6edf3; font-weight: 600; }
    .label { font-size: 14px; fill: #7ee787; }
    .desc  { font-size: 13px; fill: #8b949e; }
    .line  { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>

  <rect width="860" height="320" rx="10" fill="#0d1117" stroke="#30363d"/>

  <text x="40" y="42" class="title">Serviços</text>
  <line x1="40" y1="58" x2="820" y2="58" stroke="#30363d"/>

  <g class="line" style="animation-delay: 0.1s">
    <text x="40" y="94" class="label">▸ Desenvolvimento Web</text>
    <text x="40" y="114" class="desc">APIs REST, aplicações full-stack, integrações com serviços externos.</text>
  </g>

  <g class="line" style="animation-delay: 0.3s">
    <text x="40" y="152" class="label">▸ Arquitetura de Sistemas</text>
    <text x="40" y="172" class="desc">Modelagem de dados, desenho de serviços, escalabilidade e observabilidade.</text>
  </g>

  <g class="line" style="animation-delay: 0.5s">
    <text x="40" y="210" class="label">▸ Automação e DevOps</text>
    <text x="40" y="230" class="desc">CI/CD, containers, infraestrutura como código, monitoramento.</text>
  </g>

  <g class="line" style="animation-delay: 0.7s">
    <text x="40" y="268" class="label">▸ Consultoria Técnica</text>
    <text x="40" y="288" class="desc">Revisão de código, mentoria, definição de stack, apoio a times.</text>
  </g>
</svg>
