<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .section { fill: #7d8590; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
      .title { fill: #e6edf3; font-size: 15px; font-weight: 600; }
      .desc { fill: #7d8590; font-size: 13px; }
      .item { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      @keyframes fadeIn { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="860" height="400" rx="12" fill="#0a0e14"/>
  <rect x="0.5" y="0.5" width="859" height="399" rx="12" fill="none" stroke="#21262d"/>

  <text class="section" x="40" y="46">// SERVIÇOS</text>
  <line x1="40" y1="60" x2="820" y2="60" stroke="#21262d"/>

  <g class="item" style="animation-delay: 0.2s">
    <rect x="40" y="90" width="48" height="48" rx="10" fill="#00ff9d" fill-opacity="0.10" stroke="#00ff9d" stroke-opacity="0.30"/>
    <g transform="translate(52,102)" fill="#00ff9d">
      <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6z"/>
    </g>
    <text class="title" x="108" y="112">Desenvolvimento Web</text>
    <text class="desc" x="108" y="132">APIs REST, aplicações full-stack, integrações com serviços externos.</text>
  </g>

  <g class="item" style="animation-delay: 0.4s">
    <rect x="40" y="160" width="48" height="48" rx="10" fill="#00d9ff" fill-opacity="0.10" stroke="#00d9ff" stroke-opacity="0.30"/>
    <g transform="translate(52,172)" fill="#00d9ff">
      <path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/>
    </g>
    <text class="title" x="108" y="182">Arquitetura de Sistemas</text>
    <text class="desc" x="108" y="202">Modelagem de dados, desenho de serviços, escalabilidade e observabilidade.</text>
  </g>

  <g class="item" style="animation-delay: 0.6s">
    <rect x="40" y="230" width="48" height="48" rx="10" fill="#ffbd2e" fill-opacity="0.10" stroke="#ffbd2e" stroke-opacity="0.30"/>
    <g transform="translate(52,242)" fill="#ffbd2e">
      <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/>
    </g>
    <text class="title" x="108" y="252">Automação e DevOps</text>
    <text class="desc" x="108" y="272">CI/CD, containers, infraestrutura como código, monitoramento.</text>
  </g>

  <g class="item" style="animation-delay: 0.8s">
    <rect x="40" y="300" width="48" height="48" rx="10" fill="#bd93f9" fill-opacity="0.10" stroke="#bd93f9" stroke-opacity="0.30"/>
    <g transform="translate(52,312)" fill="#bd93f9">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
    </g>
    <text class="title" x="108" y="322">Consultoria Técnica</text>
    <text class="desc" x="108" y="342">Revisão de código, mentoria, definição de stack, apoio a times.</text>
  </g>
