<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" fill="none">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .overline { font-size: 11.5px; font-weight: 600; fill: #94A3B8; letter-spacing: 1.4px; }
      .counter { font-size: 12px; font-weight: 500; fill: #64748B; }
      .card-title { font-size: 15px; font-weight: 600; fill: #F1F5F9; letter-spacing: -0.2px; }
      .card-desc { font-size: 12.5px; font-weight: 400; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Outer Surface -->
  <rect x="1" y="1" width="838" height="308" rx="20" fill="#11141B" stroke="#252B37" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(32, 24)">
    <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="#60A5FA" stroke-width="1.5" />
    <rect x="10" y="1" width="6" height="6" rx="1.5" stroke="#60A5FA" stroke-width="1.5" />
    <rect x="1" y="10" width="6" height="6" rx="1.5" stroke="#60A5FA" stroke-width="1.5" />
    <rect x="10" y="10" width="6" height="6" rx="1.5" stroke="#60A5FA" stroke-width="1.5" />
    <text x="26" y="13" class="sans overline">ATUAÇÃO &amp; SERVIÇOS</text>
  </g>
  <text x="808" y="37" text-anchor="end" class="sans counter">04 Especialidades</text>

  <!-- Card 1: Consultoria Automotiva -->
  <g transform="translate(32, 58)">
    <rect width="380" height="104" rx="16" fill="#161B25" stroke="#252D3D" stroke-width="1" />
    <rect x="18" y="20" width="42" height="42" rx="12" fill="#182438" stroke="#273A5C" stroke-width="1" />
    <!-- Vector Car Icon -->
    <g transform="translate(29, 31)">
      <path d="M3 12L4.8 6.8C5.2 5.7 6.2 5 7.4 5H12.6C13.8 5 14.8 5.7 15.2 6.8L17 12M2 12H18C18.6 12 19 12.4 19 13V15.5C19 16.1 18.6 16.5 18 16.5H17V17.5C17 18.1 16.6 18.5 16 18.5H15C14.4 18.5 14 18.1 14 17.5V16.5H6V17.5C6 18.1 5.6 18.5 5 18.5H4C3.4 18.5 3 18.1 3 17.5V16.5H2C1.4 16.5 1 16.1 1 15.5V13C1 12.4 1.4 12 2 12Z" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="5.5" cy="14.2" r="0.9" fill="#60A5FA" />
      <circle cx="14.5" cy="14.2" r="0.9" fill="#60A5FA" />
    </g>
    <text x="76" y="38" class="sans card-title">Consultoria Automotiva</text>
    <text x="76" y="60" class="sans card-desc">Compra, venda e repasse de seminovos</text>
    <text x="76" y="78" class="sans card-desc">com busca sob medida e transparência.</text>
  </g>

  <!-- Card 2: Documentação & Despachante -->
  <g transform="translate(428, 58)">
    <rect width="380" height="104" rx="16" fill="#161B25" stroke="#252D3D" stroke-width="1" />
    <rect x="18" y="20" width="42" height="42" rx="12" fill="#1E2038" stroke="#31355E" stroke-width="1" />
    <!-- Vector Document Check Icon -->
    <g transform="translate(29, 31)">
      <path d="M5 2.5H11.5L16 7V16.5C16 17.3 15.3 18 14.5 18H5C4.2 18 3.5 17.3 3.5 16.5V4C3.5 3.2 4.2 2.5 5 2.5Z" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M11 2.5V7.5H16" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M7 12.5L9 14.5L13 10.5" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="76" y="38" class="sans card-title">Documentação &amp; Despachante</text>
    <text x="76" y="60" class="sans card-desc">Emissão de CRLV, ATPV-e, comunicado</text>
    <text x="76" y="78" class="sans card-desc">de venda e transferências em MG.</text>
  </g>

  <!-- Card 3: Financiamento & Proteção -->
  <g transform="translate(32, 178)">
    <rect width="380" height="104" rx="16" fill="#161B25" stroke="#252D3D" stroke-width="1" />
    <rect x="18" y="20" width="42" height="42" rx="12" fill="#142926" stroke="#214A43" stroke-width="1" />
    <!-- Vector Shield Check Icon -->
    <g transform="translate(29, 31)">
      <path d="M10 2L16.5 4.6V9.8C16.5 14 13.7 17.2 10 18.5C6.3 17.2 3.5 14 3.5 9.8V4.6L10 2Z" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M7.2 10.2L9.2 12.2L13 8.4" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="76" y="38" class="sans card-title">Financiamento &amp; Proteção</text>
    <text x="76" y="60" class="sans card-desc">Simulação bancária externa e planos</text>
    <text x="76" y="78" class="sans card-desc">de proteção veicular sob medida.</text>
  </g>

  <!-- Card 4: Web, UI & Automação -->
  <g transform="translate(428, 178)">
    <rect width="380" height="104" rx="16" fill="#161B25" stroke="#252D3D" stroke-width="1" />
    <rect x="18" y="20" width="42" height="42" rx="12" fill="#251D36" stroke="#3F2E5C" stroke-width="1" />
    <!-- Vector Code Icon -->
    <g transform="translate(29, 31)">
      <path d="M6.5 6.5L2.5 10.5L6.5 14.5" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13.5 6.5L17.5 10.5L13.5 14.5" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M11.2 4.5L8.8 16.5" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="76" y="38" class="sans card-title">Web, UI &amp; Automação</text>
    <text x="76" y="60" class="sans card-desc">Interfaces minimalistas, scripts e</text>
    <text x="76" y="78" class="sans card-desc">ferramentas digitais personalizadas.</text>
  </g>
</svg>
