<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="840" height="210" fill="none">
  <defs>
    <radialGradient id="ambientGlow" cx="90%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#11141B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 24px; font-weight: 600; fill: #F1F5F9; letter-spacing: -0.4px; }
      .subtitle { font-size: 14px; font-weight: 400; fill: #94A3B8; }
      .meta { font-size: 12.5px; font-weight: 500; fill: #CBD5E1; }
      .pill { font-size: 12px; font-weight: 500; fill: #E2E8F0; }
    </style>
  </defs>

  <!-- Base Surface -->
  <rect x="1" y="1" width="838" height="208" rx="20" fill="#11141B" stroke="#252B37" stroke-width="1" />
  <rect x="1" y="1" width="838" height="208" rx="20" fill="url(#ambientGlow)" />

  <!-- Monogram Tonal Container -->
  <rect x="36" y="38" width="56" height="56" rx="16" fill="#182032" stroke="#2A3752" stroke-width="1" />
  <!-- Geometric Vector J -->
  <path d="M70 54V70C70 74.4183 66.4183 78 62 78H58C55.7909 78 54 76.2091 54 74" stroke="url(#accentStroke)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="70" cy="54" r="2" fill="#818CF8" />

  <!-- Identity -->
  <text x="110" y="62" class="sans title">Jarod M M Jr</text>
  <text x="110" y="86" class="sans subtitle">Consultoria Automotiva  •  Soluções Digitais  •  Web &amp; Automação</text>

  <!-- Status Chip -->
  <rect x="688" y="46" width="116" height="30" rx="15" fill="#171C26" stroke="#273042" stroke-width="1" />
  <circle cx="706" cy="61" r="4" fill="#34D399" />
  <text x="719" y="65" class="sans pill">Disponível</text>

  <!-- Material Hairline Divider -->
  <line x1="36" y1="126" x2="804" y2="126" stroke="#1E2430" stroke-width="1" />

  <!-- Metadata Row -->
  <!-- Location -->
  <g transform="translate(36, 152)">
    <path d="M9 17.5C9 17.5 15 12.6 15 8C15 4.68629 12.3137 2 9 2C5.68629 2 3 4.68629 3 8C3 12.6 9 17.5 9 17.5Z" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="9" cy="8" r="2.2" stroke="#60A5FA" stroke-width="1.6" />
    <text x="26" y="13" class="sans meta">Belo Horizonte, MG</text>
  </g>

  <!-- Website -->
  <g transform="translate(248, 152)">
    <circle cx="9" cy="9.5" r="7" stroke="#818CF8" stroke-width="1.6" />
    <path d="M2 9.5H16M9 2.5C10.9 4.5 12 7 12 9.5C12 12 10.9 14.5 9 16.5C7.1 14.5 6 12 6 9.5C6 7 7.1 4.5 9 2.5Z" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="26" y="13" class="sans meta">jarod.com.br</text>
  </g>

  <!-- Handle -->
  <g transform="translate(414, 152)">
    <circle cx="9" cy="9.5" r="3" stroke="#34D399" stroke-width="1.6" />
    <path d="M12 9.5V10.5C12 11.6 12.9 12.5 14 12.5C15.1 12.5 16 11.6 16 10.5V9.5C16 5.6 12.9 2.5 9 2.5C5.1 2.5 2 5.6 2 9.5C2 13.4 5.1 16.5 9 16.5C10.7 16.5 12.2 15.9 13.4 14.9" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="26" y="13" class="sans meta">@jarodofc</text>
  </g>

  <!-- Right Minimal Tag -->
  <rect x="692" y="148" width="112" height="26" rx="13" fill="#161C27" stroke="#252D3D" stroke-width="1" />
  <text x="748" y="165" text-anchor="middle" class="sans" font-size="11.5" font-weight="500" fill="#94A3B8">Material UX</text>
</svg>
