<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" fill="none">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#FFFFFF" fill-opacity="0.045" />
    </pattern>
    <radialGradient id="crimsonGlow" cx="12%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .cmd { font-size: 11.5px; font-weight: 500; fill: #64748B; }
      .title { font-size: 23px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.6px; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #94A3B8; }
      .quote { font-size: 13px; font-weight: 500; fill: #E11D48; }
      .build { font-size: 10.5px; font-weight: 500; fill: #475569; letter-spacing: 1px; }
      .meta { font-size: 12px; font-weight: 500; fill: #CBD5E1; }
      .badge { font-size: 11px; font-weight: 600; fill: #CBD5E1; letter-spacing: 0.6px; }
    </style>
  </defs>

  <!-- Base Surface -->
  <rect x="1" y="1" width="838" height="218" rx="16" fill="#0B0C10" stroke="#1F242D" stroke-width="1" />
  <rect x="1" y="1" width="838" height="218" rx="16" fill="url(#dotGrid)" />
  <rect x="1" y="1" width="838" height="218" rx="16" fill="url(#crimsonGlow)" />

  <!-- Top Crimson Accent Bar -->
  <rect x="32" y="1" width="84" height="2.5" rx="1.25" fill="#E11D48" />

  <!-- Terminal Header Row -->
  <text x="32" y="30" class="mono cmd">
    <tspan fill="#E11D48">root@jarodofc</tspan><tspan fill="#475569">:~# </tspan><tspan fill="#94A3B8">./init_profile.sh</tspan>
  </text>

  <!-- Active Session Pill -->
  <rect x="652" y="14" width="156" height="24" rx="6" fill="#12151C" stroke="#1F2633" stroke-width="1" />
  <circle cx="668" cy="26" r="3.5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="681" y="29.5" class="mono badge">SESSION: ACTIVE</text>

  <!-- Hairline Divider -->
  <line x1="1" y1="48" x2="839" y2="48" stroke="#181C24" stroke-width="1" />

  <!-- Monogram Container (Material Tonal + Terminal Prompt) -->
  <rect x="32" y="68" width="60" height="60" rx="14" fill="#131115" stroke="#3B1A24" stroke-width="1" />
  <!-- Geometric Vector J_ -->
  <path d="M58 84V102C58 106.4 54.4 110 50 110H47C45.3 110 44 108.7 44 107" stroke="#F8FAFC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="64" y="106" width="13" height="2.8" rx="1" fill="#E11D48">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
  </rect>

  <!-- Identity -->
  <text x="110" y="94" class="sans title">JAROD M M JR</text>
  <text x="110" y="118" class="sans subtitle">Consultoria Automotiva  //  Soluções Digitais  //  Web &amp; Automação</text>

  <!-- Right Mr. Robot Nod -->
  <text x="808" y="92" text-anchor="end" class="mono quote">hello, friend.</text>
  <text x="808" y="115" text-anchor="end" class="mono build">BUILD // MATERIAL_UX</text>

  <!-- Hairline Divider -->
  <line x1="32" y1="152" x2="808" y2="152" stroke="#181C24" stroke-width="1" />

  <!-- Metadata Row -->
  <!-- Location -->
  <g transform="translate(32, 174)">
    <path d="M8 16C8 16 13.5 11.5 13.5 7.2C13.5 4.2 11 1.8 8 1.8C5 1.8 2.5 4.2 2.5 7.2C2.5 11.5 8 16 8 16Z" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="8" cy="7.2" r="2" stroke="#E11D48" stroke-width="1.5" />
    <text x="24" y="12.5" class="mono meta">Belo Horizonte, MG</text>
  </g>

  <!-- Website -->
  <g transform="translate(248, 174)">
    <circle cx="8" cy="8.5" r="6.5" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M1.5 8.5H14.5M8 2C9.8 3.8 10.8 6.1 10.8 8.5C10.8 10.9 9.8 13.2 8 15C6.2 13.2 5.2 10.9 5.2 8.5C5.2 6.1 6.2 3.8 8 2Z" stroke="#94A3B8" stroke-width="1.4" />
    <text x="24" y="12.5" class="mono meta">jarod.com.br</text>
  </g>

  <!-- Handle -->
  <g transform="translate(414, 174)">
    <path d="M2.5 4.5L6.5 8.5L2.5 12.5" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="8.5" y1="12.5" x2="14" y2="12.5" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round" />
    <text x="24" y="12.5" class="mono meta">@jarodofc</text>
  </g>

  <!-- System Status Tag -->
  <rect x="680" y="170" width="128" height="26" rx="6" fill="#12151C" stroke="#1F2633" stroke-width="1" />
  <rect x="693" y="180" width="6" height="6" rx="1" fill="#E11D48" />
  <text x="708" y="187" class="mono" font-size="11" font-weight="500" fill="#94A3B8">SYS // ONLINE</text>
</svg>
