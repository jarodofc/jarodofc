<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="432" viewBox="0 0 1100 432" role="img" aria-labelledby="title desc">
<title id="title">JAROD // identidade digital</title>
<desc id="desc">Cartão de perfil original estilo terminal hacker, preto e vermelho. Jarod M. M. Jr, tecnologia, design, automação e consultoria automotiva.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D0F14"/><stop offset=".55" stop-color="#08090D"/><stop offset="1" stop-color="#151017"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#F12A48" stop-opacity=".2"/><stop offset="1" stop-color="#F12A48" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8F9096" stroke-opacity=".09"/></pattern>
 <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 5.5H6" stroke="#FFFFFF" stroke-opacity=".025" stroke-width=".5"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="1098" height="430" rx="19"/></clipPath>
 <style>
 .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}
 .sans{font-family:Inter,'Arial Narrow',Arial,Helvetica,sans-serif}
 .cap{fill:#8B909C;font-size:16px;letter-spacing:2.4px;font-weight:600}
 .red{fill:#F12A48}
 </style>
</defs>
<rect x="1" y="1" width="1098" height="430" rx="19" fill="url(#bg)" stroke="#34313A" stroke-width="2"/>
<g clip-path="url(#clip)">
  <rect width="1100" height="432" fill="url(#grid)"/>
  <rect width="1100" height="432" fill="url(#scan)"/>
  <circle cx="910" cy="247" r="320" fill="url(#glow)"/>
  <path d="M0 429H1100" stroke="#F12A48" stroke-width="6"/>
  <path d="M785 0H1100V432" fill="none" stroke="#F12A48" stroke-opacity=".09" stroke-width="2"/>
  <path d="M970 70h130M1000 86h100M1020 102h80" stroke="#F12A48" stroke-opacity=".19" stroke-width="2"/>
</g>
<!-- window chrome -->
<circle cx="45" cy="36" r="5" fill="#F12A48"/>
<circle cx="64" cy="36" r="5" fill="#5A5D65"/>
<circle cx="83" cy="36" r="5" fill="#31343B"/>
<text x="106" y="42" class="mono cap">JAROD.SYSTEM / PROFILE.INIT</text>
<text x="1058" y="42" text-anchor="end" class="mono" font-size="15" font-weight="700" letter-spacing="1.5" fill="#F12A48">● SESSION: ACTIVE</text>
<line x1="30" y1="69" x2="1070" y2="69" stroke="#33323B" stroke-width="1.4"/>
<!-- intro -->
<rect x="47" y="103" width="6" height="29" rx="3" fill="#F12A48"/>
<text x="67" y="124" class="mono" font-size="17" font-weight="700" letter-spacing="3" fill="#F12A48">IDENTITY // 001</text>
<text x="42" y="238" class="sans" font-size="111" font-weight="800" letter-spacing="-5.5" fill="#F4F5F7">JAROD<tspan fill="#F12A48">.</tspan></text>
<text x="49" y="297" class="sans" font-size="52" font-weight="760" letter-spacing="-1.4" fill="#F4F5F7">M. M. JR.</text>
<path d="M47 326H657" stroke="#38323B" stroke-width="1.5"/>
<text x="48" y="357" class="sans" font-size="21" font-weight="500" fill="#C6C9D1">TECNOLOGIA  /  DESIGN  /  AUTOMAÇÃO</text>
<text x="48" y="392" class="mono" font-size="15" letter-spacing="1.5" fill="#8D939E"><tspan fill="#F12A48">&gt; </tspan>CONSULTORIA AUTOMOTIVA   •   BELO HORIZONTE, MG</text>
