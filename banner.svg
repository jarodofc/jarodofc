<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180">
  <defs>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0.15"/>
    </linearGradient>
    <style>
      .name { font-family: ui-monospace, Menlo, monospace; font-size: 32px; font-weight: 700; fill: #e6edf3; letter-spacing: 1px; }
      .role { font-family: ui-monospace, Menlo, monospace; font-size: 13px; fill: #7d8590; letter-spacing: 0.5px; }
      .tag  { font-family: ui-monospace, Menlo, monospace; font-size: 13px; fill: #00ff9d; }
      .blur-bg { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 0.9; } }
    </style>
  </defs>

  <rect width="860" height="180" rx="14" fill="#0a0e14"/>
  <rect width="860" height="180" rx="14" fill="url(#grad)" class="blur-bg" filter="url(#blur)"/>
  <rect x="0.5" y="0.5" width="859" height="179" rx="13.5" fill="none" stroke="#21262d"/>

  <text x="44" y="80" class="name">JAROD M M JR</text>
  <text x="44" y="108" class="role">FULL-STACK · ARQUITETURA · DEVOPS</text>

  <line x1="44" y1="128" x2="816" y2="128" stroke="#21262d"/>

  <text x="44" y="156" class="tag">$</text>
  <text x="66" y="156" class="role">Soluções sob medida em web, dados e infraestrutura.</text>

  <circle cx="820" cy="40" r="6" fill="#00ff9d">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
