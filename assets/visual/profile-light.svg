 .cursor {animation:blink 1.25s steps(1,end) infinite}
 .status {animation:breathe 2.8s ease-in-out infinite}
 .scanner {animation:travel 19s linear infinite}
 @media (prefers-reduced-motion:reduce){.cursor,.status,.scanner{animation:none!important}}
 </style>
